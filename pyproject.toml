[project]
name = "projet-api"
version = "0.1.0"
description = "API de résolution automatique de CAPTCHAs visuels - M2 MoSEF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "mypy==1.10.0",
    "ruff==0.6.9",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
]


