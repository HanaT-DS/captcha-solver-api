[project]
name = "projet-api"
version = "0.1.0"
description = "API de résolution automatique de CAPTCHAs visuels - M2 MoSEF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1",
    "torch>=2.9.1",
    "numpy>=2.4.0",
    "albumentations>=2.0.8",
    "pillow>=12.0.0",
    "joblib>=1.5.3",
    "torchvision>=0.24.1",
    "python-multipart>=0.0.21",
    "easyocr>=1.7.2",
    "playwright>=1.57.0",
    "transformers>=4.57.3",
    "accelerate>=1.12.0",
    "sentencepiece>=0.2.1",
    "timm>=1.0.23",
    "opencv-python-headless>=4.11.0.86",
    "scipy>=1.16.3",
    "rich>=14.2.0",
    "einops>=0.8.1",
]

[project.optional-dependencies]
dev = [
    "mypy==1.10.0",
    "ruff==0.6.9",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.8",
    "scikit-learn>=1.8.0",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "plotly>=6.5.0",
    "streamlit>=1.52.2"
]



